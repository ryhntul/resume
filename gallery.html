<!-- The Modal (Lightbox) Structure -->
<div id="imageModal" class="modal" onclick="closeModal()">
    <span class="close-btn" title="Close Modal">&times;</span>
    <div style="text-align:center;">
        <img class="modal-content" id="modalImage">
    </div>
    <div id="caption"></div>
    <!-- Navigation Arrows -->
    <a class="modal-arrow prev-arrow" onclick="plusSlides(-1); event.stopPropagation();">&#10094;</a>
    <a class="modal-arrow next-arrow" onclick="plusSlides(1); event.stopPropagation();">&#10095;</a>
</div>


<script>
    // --- Clock Script (copied from family.html) ---
    const pad = (number) => (number < 10 ? '0' + number : number);
    function updateClock(){
        const now = new Date();
        const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const dayOfWeek = days[now.getDay()];
        const dayOfMonth = now.getDate();
        const monthName = months[now.getMonth()];
        const year = now.getFullYear();
        const dateString = `${dayOfWeek}, ${pad(dayOfMonth)} ${monthName} ${year}`;
        let hours = now.getHours();
        const minutes = now.getMinutes();
        const seconds = now.getSeconds();
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12;
        const timeString = `${pad(hours)}:${pad(minutes)}:${pad(seconds)} ${ampm}`;
        const clockElement = document.getElementById('header-clock');
        if (clockElement) {
            clockElement.innerHTML = `${dateString}<br>${timeString}`;
        }
    }

    // --- Gallery Lightbox Script ---
    const modal = document.getElementById('imageModal');
    const modalImg = document.getElementById('modalImage');
    const captionText = document.getElementById('caption');
    
    let currentCategoryImages = [];
    let currentCategoryCaptions = [];
    let slideIndex = 0;

    // Mapping to easily grab the image/caption lists from the first image in each card
    const dataMap = {};

    document.addEventListener('DOMContentLoaded', () => {
        updateClock();
        setInterval(updateClock, 1000);
        
        // Initialize the data map by reading data- attributes from the first image of each card
        document.querySelectorAll('.gallery-card').forEach(card => {
            const category = card.getAttribute('data-category');
            const firstImage = card.querySelector('.preview-grid img');
            if (firstImage) {
                // To support the wider UiTM card, I'm adding dummy images/captions to the UITM array 
                // in the JavaScript for demonstration purposes. In a real app, you would define these.
                let images = JSON.parse(firstImage.getAttribute('data-images'));
                let captions = JSON.parse(firstImage.getAttribute('data-captions'));

                // TEMPORARY FIX: Inject more dummy content for the wider UITM card
                if (category === 'uitm' && images.length < 5) {
                    images.push("https://placehold.co/800x600/337AB7/ffffff?text=UiTM+Full+4", "https://placehold.co/800x600/003366/ffffff?text=UiTM+Full+5");
                    captions.push("Another photo from campus life.", "Night view of the library.");
                }

                dataMap[category] = {
                    images: images,
                    captions: captions
                };
            }
        });

        // Set up click handler on the modal background to close it
        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                closeModal();
            }
        });
    });

    // Function to open the modal and display the first image in the clicked category
    function openModal(category, index) {
        // Stop event propagation in case an image itself was clicked, preventing immediate closure
        event.stopPropagation();
        
        const data = dataMap[category];
        if (!data) return;

        currentCategoryImages = data.images;
        currentCategoryCaptions = data.captions;
        
        modal.style.display = 'block';
        showSlides(index);
    }

    // Function to close the modal
    function closeModal() {
        modal.style.display = 'none';
    }

    // Function to change the slide index
    function plusSlides(n) {
        showSlides(slideIndex + n);
    }

    // Function to display the specific slide
    function showSlides(n) {
        if (currentCategoryImages.length === 0) return;

        // Loop back if index is out of bounds
        if (n >= currentCategoryImages.length) {
            slideIndex = 0;
        } else if (n < 0) {
            slideIndex = currentCategoryImages.length - 1;
        } else {
            slideIndex = n;
        }

        // Update the image source and caption
        modalImg.src = currentCategoryImages[slideIndex];
        modalImg.alt = currentCategoryCaptions[slideIndex];
        captionText.innerHTML = `${currentCategoryCaptions[slideIndex]} (${slideIndex + 1} of ${currentCategoryImages.length})`;
    }
</script>
